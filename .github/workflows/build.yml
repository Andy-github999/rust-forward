name: Build rust-forward

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Override password (leave empty to use secret)'
        required: false
        type: string

env:
  RUST_FORWARD_PASSWORD: ${{ inputs.password || secrets.RUST_FORWARD_PASSWORD || '1' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bins
      - uses: ncipollo/release-action@v1
        with:
          name: "Windows build ${{ github.run_id }} (${{ github.ref_name }})"
          tag: win-${{ github.ref_name }}-${{ github.run_id }}
          artifacts: |
            target/release/bridge.exe
            target/release/forward.exe
          token: ${{ secrets.GITHUB_TOKEN }}

  openwrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Cache musl toolchain
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/aarch64-linux-musl-cross
          key: musl-aarch64-v1
      - name: Install musl toolchain
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: |
          curl -L https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/musl.tgz
          sudo tar xzf /tmp/musl.tgz -C /opt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl --bins
      - uses: ncipollo/release-action@v1
        with:
          name: "OpenWrt build ${{ github.run_id }} (${{ github.ref_name }})"
          tag: openwrt-${{ github.ref_name }}-${{ github.run_id }}
          artifacts: |
            target/aarch64-unknown-linux-musl/release/bridge
            target/aarch64-unknown-linux-musl/release/forward
          token: ${{ secrets.GITHUB_TOKEN }}